plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xcheng.xclogger'
    compileSdk 33

    defaultConfig {
        applicationId "com.xcheng.xclogger"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        def baseName = "XCLogger" // APK基础名称
        def buildType = variant.buildType.name
        def versionName = variant.versionName ?: "V1.0.0"
        def versionCode = variant.versionCode ?: 1
        def timestamp = new Date().format("yyyyMMddHHmm")
        def apkName

        // 根据构建类型应用不同命名规则
        if (buildType == "debug") {
            // Debug版本：[APK Name]_[Build Type].apk
//            apkName = "${baseName}_${buildType}.apk"
            // Release版本：[APK Name]_v[Release Version]_[Timestamp].apk
            apkName = "${baseName}_v${versionName}_${timestamp}.apk"
        } else {
            // Release版本：[APK Name]_v[Release Version]_[Timestamp].apk
            apkName = "${baseName}_v${versionName}_${timestamp}.apk"
        }

        // 过滤非法字符
        apkName = apkName.replaceAll("[^a-zA-Z0-9_.-]", "_")

        // 应用文件名
        variant.outputs.each { output ->
            output.outputFileName = apkName
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}